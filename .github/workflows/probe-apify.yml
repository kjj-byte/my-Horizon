name: Probe Apify Twitter
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: Inspect actor metadata and schema
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["APIFY_TOKEN"]
          base = "https://api.apify.com/v2"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def get(path):
              req = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"err": e.code, "body": e.read()[:400].decode("utf-8", "replace")}

          meta = get("/acts/altimis~scweet")
          d = meta.get("data", {})
          print("title:", d.get("title"), "| modified:", d.get("modifiedAt"), "| isPublic:", d.get("isPublic"))
          print("exampleRunInput:", json.dumps(d.get("exampleRunInput"), ensure_ascii=False)[:500])
          print("defaultRunOptions:", json.dumps(d.get("defaultRunOptions"), ensure_ascii=False)[:300])

          build = get("/acts/altimis~scweet/builds/default")
          b = build.get("data", {})
          schema = (b.get("inputSchema") or "")
          print("build number:", b.get("buildNumber"), "| finishedAt:", b.get("finishedAt"))
          if schema:
              s = schema if isinstance(schema, str) else json.dumps(schema)
              print("input schema (first 1200):", s[:1200])
          else:
              print("build resp:", json.dumps(build, ensure_ascii=False)[:600])

          runs = get("/actor-runs?desc=1&limit=5")
          for r in runs.get("data", {}).get("items", []):
              print("recent run:", r["id"], r["status"], r["startedAt"], "items?")
          PY
