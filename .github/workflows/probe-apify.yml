name: Probe Apify Twitter
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: scweet with dates, then try candidate actors from the store
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          token = os.environ["APIFY_TOKEN"]
          base = "https://api.apify.com/v2"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"err": e.code, "body": e.read()[:200].decode("utf-8", "replace")}
              except Exception as e:
                  return {"err": type(e).__name__, "body": str(e)[:200]}

          def run(actor, payload, label):
              res = call("POST", f"/acts/{actor}/runs", payload)
              if "data" not in res:
                  print(f"[{label}] start failed: {res}"); return
              rid, did = res["data"]["id"], res["data"]["defaultDatasetId"]
              st = "?"
              for _ in range(72):
                  info = call("GET", f"/actor-runs/{rid}")
                  st = info.get("data", {}).get("status")
                  if st in ("SUCCEEDED", "FAILED", "ABORTED", "TIMED-OUT"):
                      break
                  time.sleep(5)
              items = call("GET", f"/datasets/{did}/items")
              n = len(items) if isinstance(items, list) else -1
              print(f"[{label}] status={st} items={n}")
              if n > 0:
                  print("   keys:", sorted(items[0].keys())[:22])
                  print("   sample:", json.dumps(items[0], ensure_ascii=False)[:260])

          run("altimis~scweet",
              {"source_mode": "search", "search_query": "AI credits", "search_sort": "Latest",
               "max_items": 100, "since": "2026-10-30", "until": "2026-11-02"}, "scweet+dates")

          for actor in ("xquik~x-tweet-scraper",
                        "kaitoeasyapi~twitter-x-data-tweet-scraper-pay-per-result-cheapest",
                        "apidojo~twitter-scraper-lite"):
              meta = call("GET", f"/acts/{actor}")
              d = meta.get("data", {})
              ex = d.get("exampleRunInput") or {}
              body = ex.get("body")
              print(f"META {actor}: title={d.get('title','?')[:40]} example={str(body)[:220]}")
              if not body:
                  continue
              try:
                  payload = json.loads(body) if isinstance(body, str) else body
              except Exception:
                  continue
              replaced = json.dumps(payload).replace("bitcoin", "AI credits")
              try:
                  payload = json.loads(replaced)
              except Exception:
                  pass
              run(actor, payload, actor.split("~")[1])
          PY
