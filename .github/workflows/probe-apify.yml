name: Probe Apify Twitter
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: Dump xquik + apidojo schemas and one full item
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          token = os.environ["APIFY_TOKEN"]
          base = "https://api.apify.com/v2"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"err": e.code, "body": e.read()[:200].decode("utf-8", "replace")}
              except Exception as e:
                  return {"err": type(e).__name__, "body": str(e)[:200]}

          def run(actor, payload):
              res = call("POST", f"/acts/{actor}/runs", payload)
              rid, did = res["data"]["id"], res["data"]["defaultDatasetId"]
              for _ in range(72):
                  info = call("GET", f"/actor-runs/{rid}")
                  if info.get("data", {}).get("status") in ("SUCCEEDED", "FAILED", "ABORTED", "TIMED-OUT"):
                      break
                  time.sleep(5)
              items = call("GET", f"/datasets/{did}/items?limit=3")
              return items if isinstance(items, list) else []

          meta = call("GET", "/acts/xquik~x-tweet-scraper")
          print("XQUIK example:", json.dumps(meta.get("data", {}).get("exampleRunInput"), ensure_ascii=False)[:800])
          items = run("xquik~x-tweet-scraper",
                      {"searchTerms": ["free AI credits"], "maxItems": 100,
                       "queryType": "Latest + Top", "outputVariant": "rich", "fieldStyle": "camel"})
          print("XQUIK items:", len(items))
          if items:
              it = items[0]
              print("XQUIK all keys:", sorted(it.keys()))
              print("XQUIK item:", json.dumps(it, ensure_ascii=False)[:1500])

          items2 = run("apidojo~twitter-scraper-lite",
                       {"includeSearchTerms": False, "maxItems": 100,
                        "searchTerms": ["free AI credits"], "sort": "Latest"})
          print("APIDOJO items:", len(items2))
          if items2:
              print("APIDOJO item:", json.dumps(items2[0], ensure_ascii=False)[:1500])
          PY
