name: Probe Apify Twitter
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: Try the actor with its own example and another sort
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          token = os.environ["APIFY_TOKEN"]
          base = "https://api.apify.com/v2"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"err": e.code, "body": e.read()[:300].decode("utf-8", "replace")}

          def run(payload, label):
              res = call("POST", "/acts/altimis~scweet/runs", payload)
              rid = res["data"]["id"]
              did = res["data"]["defaultDatasetId"]
              status = "READY"
              for _ in range(60):
                  info = call("GET", f"/actor-runs/{rid}")
                  status = info["data"]["status"]
                  if status in ("SUCCEEDED", "FAILED", "ABORTED", "TIMED-OUT"):
                      break
                  time.sleep(5)
              items = call("GET", f"/datasets/{did}/items")
              n = len(items) if isinstance(items, list) else -1
              usage = info["data"].get("usageTotalUsd")
              print(f"[{label}] status={status} items={n} usage={usage} run={rid}")
              if n > 0:
                  print("   first keys:", sorted(items[0].keys()))
                  print("   sample:", json.dumps(items[0], ensure_ascii=False)[:400])
              elif isinstance(items, list):
                  print("   empty dataset")
              return n

          run({"source_mode": "search", "search_query": "bitcoin",
               "search_sort": "Latest", "max_items": 1000}, "actor-example")
          run({"source_mode": "search", "search_query": "AI credits",
               "search_sort": "Top", "max_items": 20}, "top-sort")
          run({"source_mode": "search", "search_query": "OpenAI",
               "search_sort": "Latest", "max_items": 20, "since": "2026-11-01",
               "until": "2026-11-02"}, "with-dates")
          PY
