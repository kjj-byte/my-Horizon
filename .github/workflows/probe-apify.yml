name: Probe Apify Twitter
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - name: scweet payload variants + store search
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          token = os.environ["APIFY_TOKEN"]
          base = "https://api.apify.com/v2"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"err": e.code, "body": e.read()[:200].decode("utf-8", "replace")}
              except Exception as e:
                  return {"err": type(e).__name__, "body": str(e)[:200]}

          def run(payload, label):
              res = call("POST", "/acts/altimis~scweet/runs", payload)
              if "data" not in res:
                  print(f"[{label}] start failed: {res}"); return
              rid, did = res["data"]["id"], res["data"]["defaultDatasetId"]
              st = "?"
              for _ in range(60):
                  info = call("GET", f"/actor-runs/{rid}")
                  st = info.get("data", {}).get("status")
                  if st in ("SUCCEEDED", "FAILED", "ABORTED", "TIMED-OUT"):
                      break
                  time.sleep(5)
              items = call("GET", f"/datasets/{did}/items")
              n = len(items) if isinstance(items, list) else -1
              print(f"[{label}] status={st} items={n}")
              if n > 0:
                  print("   keys:", sorted(items[0].keys())[:20])
                  print("   created_at:", items[0].get("created_at"), "text:", str(items[0].get("text") or items[0].get("full_text"))[:80])

          run({"source_mode": "search", "search_query": "AI credits", "search_sort": "Latest",
               "max_items": 20, "since": "2026-10-30", "until": "2026-11-02"}, "since/until")
          run({"source_mode": "search", "search_query": "AI credits", "search_sort": "Latest",
               "max_items": 20, "within": "3d"}, "within-3d")
          run({"source_mode": "search", "search_query": "AI credits", "search_sort": "Top",
               "max_items": 20, "lang": "en"}, "top+lang")

          store = call("GET", "/store?search=twitter%20scraper&limit=8")
          for it in (store.get("data") or {}).get("items", [])[:8]:
              print("STORE:", it.get("username"), "/", it.get("name"), "|", (it.get("title") or "")[:50])
          PY
