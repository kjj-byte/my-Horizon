name: Probe Apify Twitter
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q httpx pydantic python-dateutil feedparser
          pip install -q dateutil 2>/dev/null || true
      - name: Run Horizon's own TwitterScraper against the new actor
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python3 - <<'PY'
          import asyncio, json, sys
          from datetime import datetime, timedelta, timezone
          import httpx
          from src.models import Config
          from src.scrapers.twitter import TwitterScraper

          cfg = Config(**json.load(open("data/config.github.json", encoding="utf-8")))
          tw = cfg.sources.twitter
          tw.keywords = tw.keywords[:2]
          print("actor:", tw.actor_id, "| keywords:", tw.keywords)

          async def main():
              async with httpx.AsyncClient(timeout=60) as client:
                  items = await TwitterScraper(tw, client).fetch(
                      datetime.now(timezone.utc) - timedelta(hours=72))
              print("ITEMS", len(items))
              for i in items[:5]:
                  print(" -", i.published_at.strftime("%m-%d %H:%M"), "|", i.title[:70])

          asyncio.run(main())
          PY
