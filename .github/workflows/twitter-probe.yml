name: Twitter Probe

# Manual-only: runs the Apify Twitter scraper alone and reports how many rows the
# actor returns vs. how many survive parsing. Publishes nothing, touches no docs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - run: uv sync

      - name: Probe Twitter source
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run python scripts/twitter_probe.py