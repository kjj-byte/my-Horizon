name: Daily Horizon Summary

on:
  schedule:
    # Fallback only. 00:30 UTC = 08:30 Asia/Shanghai, kept 1.5h after the local 07:00
    # task so a longer run (more RSS) does not collide. Primary trigger is the local
    # Windows task at 07:00; the preflight job below prevents a double run.
    - cron: '30 0 * * *'
  workflow_dispatch:      # Allow manual trigger

# One run at a time so a manual run never overlaps the scheduled one.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if a summary was already published in the last 6 hours
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WINDOW_HOURS: "6"
        run: |
          set -euo pipefail
          skip=false
          now=$(date -u +%s)
          for d in "$(date -u +%F)" "$(date -u -d 'yesterday' +%F)"; do
            ts=$(gh api "repos/$REPO/commits?path=_posts/$d-summary-zh.md&sha=gh-pages&per_page=1" \
                 --jq '.[0].commit.committer.date' 2>/dev/null || true)
            if [ -n "$ts" ] && [ "$ts" != "null" ]; then
              age_h=$(( (now - $(date -u -d "$ts" +%s)) / 3600 ))
              echo "$d-summary-zh.md last committed $ts (${age_h}h ago)"
              if [ "$age_h" -lt "$WINDOW_HOURS" ]; then skip=true; fi
            fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  daily-summary:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90   # fetch + many AI calls; fail instead of hanging for hours
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 72

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

  # Runs when the daily job fails OR times out (a timeout is a failure).
  notify-failure:
    needs: daily-summary
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure notice to webhook (if configured)
        env:
          WEBHOOK: ${{ secrets.HORIZON_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "HORIZON_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"Horizon daily job failed or timed out: $RUN_URL\"}}"
