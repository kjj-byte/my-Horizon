name: Daily Horizon Summary

on:
  schedule:
    # Fallback only. 23:30 UTC = 07:30 Asia/Shanghai, 1.5h after the local 06:00
    # task, so a run that is slow or queued still finishes first; preflight then
    # skips this one. This cron is UTC: changing display.timezone also means
    # editing this line.
    - cron: '30 23 * * *'
  workflow_dispatch:      # Allow manual trigger; the 06:00 task uses this too
    inputs:
      # Manual runs honour the dedupe unless this is set. The scheduled cron must
      # never see a publish before it, so force stays off by default.
      force:
        description: "Skip the 12h dedupe check"
        type: boolean
        default: false

# One run at a time so a manual run never overlaps the scheduled one.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout config
        uses: actions/checkout@v6

      - name: Skip if this run is a duplicate of one already published
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Post filenames use display.timezone, not the runner's UTC day.
          TZ_NAME=$(python3 -c "import json;print(json.load(open('data/config.github.json'))['display']['timezone'])")
          DATE=$(TZ="$TZ_NAME" date +%F)
          skip=false
          # Same-day runs are identical by definition (same 36h window), so one publish per
          # local day; a cron queued into the next day still publishes, just only once.
          # Committer dates are no proof of a publish: every re-publish rewrites them.
          published=$(gh api "repos/$REPO/commits?path=_posts/$DATE-summary-zh.md&sha=gh-pages&per_page=1" \
                      --jq 'if length > 0 then "true" else "false" end' 2>/dev/null || echo false)
          if [ "$published" = "true" ]; then
            echo "_posts/$DATE-summary-zh.md is already on gh-pages"
            skip=true
          else
            echo "_posts/$DATE-summary-zh.md not on gh-pages yet"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "publish=$(TZ="$TZ_NAME" date -d '+1 day' +%F)" >> "$GITHUB_OUTPUT"

  daily-summary:
    needs: preflight
    # Every trigger honours the dedupe; only an explicit force=true skips it. The 06:00
    # task and the cron both must not publish twice if the other one already did.
    if: ${{ !cancelled() && (inputs.force == true || needs.preflight.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90   # fetch + many AI calls; fail instead of hanging for hours
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        run: |
          set -euo pipefail
          cp data/config.github.json data/config.json
          # The repo is public: never keep the owner's address in the committed config.
          if [ -z "${EMAIL_ADDRESS:-}" ]; then
            echo "EMAIL_ADDRESS secret is empty; the digest would have no recipient." >&2
            exit 1
          fi
          python3 - "${EMAIL_ADDRESS}" <<'PY'
          import json, sys
          address = sys.argv[1]
          with open("data/config.json", encoding="utf-8") as handle:
              config = json.load(handle)
          config["email"]["email_address"] = address
          config["email"]["smtp_username"] = address
          with open("data/config.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle, ensure_ascii=False, indent=2)
          PY

      # Recent published digests feed both the 3-day repeat filter and the
      # history_search tool; a 72h fetch window otherwise republishes yesterday.
      - name: Restore recent digests
        run: |
          set -euo pipefail
          # No gh-pages yet (first run): the filter just has nothing to compare against.
          git fetch --no-tags --depth 1 origin gh-pages || { echo "::warning::no gh-pages; repeat filter is off"; exit 0; }
          if ! git cat-file -e FETCH_HEAD:_posts 2>/dev/null; then
            echo "::warning::gh-pages has no _posts yet; repeat filter is off"
            exit 0
          fi
          mkdir -p docs
          # FETCH_HEAD avoids assuming how actions/checkout set up remote-tracking refs.
          git archive FETCH_HEAD _posts | tar -x -C docs
          count=$(ls docs/_posts 2>/dev/null | wc -l || true)
          echo "restored $count posts"
          if [ "$count" -eq 0 ]; then
            echo "::error::posts exist on gh-pages but none were restored; refusing to publish a digest that would repeat earlier ones"
            exit 1
          fi

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_API_KEY_2: ${{ secrets.FIRECRAWL_API_KEY_2 }}
          CRAWL4AI_API_KEY: ${{ secrets.CRAWL4AI_API_KEY }}
          CRAWL4AI_API_KEY_2: ${{ secrets.CRAWL4AI_API_KEY_2 }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon

      - name: Set the publish date
        env:
          PUBLISH_DATE: ${{ needs.preflight.outputs.publish }}
        run: |
          # The date preflight checked: a run finishing after local midnight must publish
          # under that date, to the post file the preflight checked, not tomorrow's.
          echo "DATE=$PUBLISH_DATE" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
          full_commit_message: "published at ${{ github.run_started_at }}"

  # Runs when the daily job fails OR times out (a timeout is a failure, and the
  # run is killed before it can send its own failure email).
  notify-failure:
    needs: daily-summary
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mailer
        uses: actions/checkout@v6

      - name: Email the failure
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${EMAIL_ADDRESS:-}" ] || [ -z "${EMAIL_PASSWORD:-}" ]; then
            echo "email secrets not set; skipping notification"
            exit 0
          fi
          python3 scripts/send_mail.py \
            "Horizon 运行失败 $(date -u +%F)" \
            "每日任务失败或被超时终止：$RUN_URL"

      - name: Post failure notice to webhook (if configured)
        env:
          WEBHOOK: ${{ secrets.HORIZON_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "HORIZON_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"Horizon daily job failed or timed out: $RUN_URL\"}}"