name: Daily Horizon Summary

on:
  schedule:
    # Fallback only. 00:30 UTC = 08:30 Asia/Shanghai, kept 1.5h after the local 07:00
    # task so a longer run (more RSS) does not collide. Primary trigger is the local
    # Windows task at 07:00; the preflight job below prevents a double run.
    # This cron is UTC: changing display.timezone also means editing this line.
    - cron: '30 0 * * *'
  workflow_dispatch:      # Allow manual trigger; the 07:00 task uses this too
    inputs:
      # Manual runs honour the dedupe unless this is set. The scheduled cron must
      # never see a publish before it, so force stays off by default.
      force:
        description: "Skip the 12h dedupe check"
        type: boolean
        default: false

# One run at a time so a manual run never overlaps the scheduled one.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout config
        uses: actions/checkout@v6

      - name: Skip if a summary was already published inside the window
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # GitHub can queue a cron hours late; 12h still covers the 07:00 run
          # (a cron landed 7h late and produced a duplicate summary).
          WINDOW_HOURS: "12"
        run: |
          set -euo pipefail
          # Post filenames use display.timezone, not the runner's UTC day.
          TZ_NAME=$(python3 -c "import json;print(json.load(open('data/config.github.json'))['display']['timezone'])")
          skip=false
          now=$(date -u +%s)
          for d in "$(TZ="$TZ_NAME" date +%F)" "$(TZ="$TZ_NAME" date -d 'yesterday' +%F)"; do
            ts=$(gh api "repos/$REPO/commits?path=_posts/$d-summary-zh.md&sha=gh-pages&per_page=1" \
                 --jq '.[0].commit.committer.date' 2>/dev/null || true)
            if [ -n "$ts" ] && [ "$ts" != "null" ]; then
              age_h=$(( (now - $(date -u -d "$ts" +%s)) / 3600 ))
              echo "$d-summary-zh.md last committed $ts (${age_h}h ago)"
              if [ "$age_h" -lt "$WINDOW_HOURS" ]; then skip=true; fi
            fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  daily-summary:
    needs: preflight
    # Every trigger honours the dedupe; only an explicit force=true skips it. The 07:00
    # task and the cron both must not publish twice if the other one already did.
    if: ${{ !cancelled() && (inputs.force == true || needs.preflight.outputs.skip != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90   # fetch + many AI calls; fail instead of hanging for hours
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        run: |
          set -euo pipefail
          cp data/config.github.json data/config.json
          # The repo is public: never keep the owner's address in the committed config.
          if [ -z "${EMAIL_ADDRESS:-}" ]; then
            echo "EMAIL_ADDRESS secret is empty; the digest would have no recipient." >&2
            exit 1
          fi
          python3 - "${EMAIL_ADDRESS}" <<'PY'
          import json, sys
          address = sys.argv[1]
          with open("data/config.json", encoding="utf-8") as handle:
              config = json.load(handle)
          config["email"]["email_address"] = address
          config["email"]["smtp_username"] = address
          with open("data/config.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle, ensure_ascii=False, indent=2)
          PY

      # Recent published digests feed both the 3-day repeat filter and the
      # history_search tool; a 72h fetch window otherwise republishes yesterday.
      - name: Restore recent digests
        run: |
          set -euo pipefail
          # No gh-pages yet (first run): the filter just has nothing to compare against.
          git fetch --no-tags --depth 1 origin gh-pages || { echo "::warning::no gh-pages; repeat filter is off"; exit 0; }
          mkdir -p docs
          git archive origin/gh-pages _posts 2>/dev/null | tar -x -C docs || true
          count=$(ls docs/_posts 2>/dev/null | wc -l)
          echo "restored $count posts"
          if [ "$count" -eq 0 ]; then
            echo "::warning::no posts restored; repeats will not be filtered today"
          fi

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_TOKEN_2 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CRAWL4AI_API_KEY: ${{ secrets.CRAWL4AI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon

      - name: Set current date as environment variable
        run: |
          TZ_NAME=$(python3 -c "import json;print(json.load(open('data/config.json'))['display']['timezone'])")
          echo "DATE=$(TZ="$TZ_NAME" date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

  # Runs when the daily job fails OR times out (a timeout is a failure, and the
  # run is killed before it can send its own failure email).
  notify-failure:
    needs: daily-summary
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mailer
        uses: actions/checkout@v6

      - name: Email the failure
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${EMAIL_ADDRESS:-}" ] || [ -z "${EMAIL_PASSWORD:-}" ]; then
            echo "email secrets not set; skipping notification"
            exit 0
          fi
          python3 scripts/send_mail.py \
            "Horizon 运行失败 $(date -u +%F)" \
            "每日任务失败或被超时终止：$RUN_URL"

      - name: Post failure notice to webhook (if configured)
        env:
          WEBHOOK: ${{ secrets.HORIZON_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "HORIZON_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"Horizon daily job failed or timed out: $RUN_URL\"}}"