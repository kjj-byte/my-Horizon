name: Post-run Check

# Emails a verdict after the daily run: did it publish, under the right date, and
# did the dedupe catch the fallback cron? Runs daily at 01:00 UTC (09:00 Beijing,
# display.timezone) until the CHECK_UNTIL repo variable's date has passed.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check today's run and email the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CHECK_UNTIL: ${{ vars.CHECK_UNTIL }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python3 scripts/post_run_check.py